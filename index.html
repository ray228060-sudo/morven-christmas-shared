<section id="postcard">
 <h2><span id="postcardGreeting">欢迎 Morven 的朋友</span><small id="postcardSender" hidden>From Morven</small></h2>
 <canvas id="evergreen" role="img" aria-label="挂着暖金灯、覆着白雪的层叠圣诞树"></canvas>
 <form id="friendForm"><label for="friendName">你的名字</label><div><input id="friendName" type="text" inputmode="text" enterkeyhint="go" autocomplete="given-name" maxlength="40" required placeholder="输入名字"><button type="submit">打开贺卡</button></div><small id="gestureStatus" role="status"></small></form>

<div id="morven3d" hidden>From Morven</div>
<script>
(() => {
 const canvas=document.querySelector('#evergreen');
 const cx=canvas.getContext('2d');
 function draw(){
  if(!cx||canvas.clientHeight<1)return;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const d=Math.min(devicePixelRatio||1,1.5);
  canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
  cx.setTransform(d,0,0,d,0,0);
  let seed=12071;
  const rand=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};
  const x=w/2,unit=Math.min(w/400,h/470),base=h*.91;
  cx.save();cx.translate(x,base);cx.scale(unit,unit);
  const ellipse=(a,b,r,s,fill)=>{cx.fillStyle=fill;cx.beginPath();cx.ellipse(a,b,r,s,0,0,Math.PI*2);cx.fill()};
  for(let i=0;i<290;i++) ellipse((rand()-.5)*600,-rand()*480,rand()*1.65+.25,rand()*1.45+.25,'rgba(255,242,224,'+(.11+rand()*.53)+')');
  const ground=cx.createRadialGradient(0,7,5,0,7,125);
  ground.addColorStop(0,'#fff7e5');ground.addColorStop(1,'#fff7e500');
  ellipse(0,7,128,20,ground);
  cx.fillStyle='#3a241b';cx.fillRect(-7,-57,14,58);
  const layers=8;
  for(let layer=0;layer<layers;layer++){
   const y=-37-layer*41, radius=132-layer*14;
   for(let branch=0;branch<41;branch++){
    const side=branch%2?1:-1;
    const reach=(.26+rand()*.74)*radius;
    const tipX=side*reach, tipY=y-12+rand()*22;
    const stemY=y-48-rand()*15;
    cx.strokeStyle=['#1e381b','#3e5823','#628332'][branch%3];cx.lineWidth=3+rand()*2;
    cx.beginPath();cx.moveTo(0,stemY);cx.quadraticCurveTo(tipX*.58,tipY+6,tipX,tipY);cx.stroke();
    for(let n=1;n<=18;n++){
     const t=n/19, a=tipX*t,b=stemY+(tipY-stemY)*(1-(1-t)**2);
     const spread=(3+rand()*9)*(1-t*.54);
     cx.strokeStyle=['#284721','#5c802b','#8da439','#baca60'][n%4];cx.lineWidth=.8+rand();
     cx.beginPath();cx.moveTo(a,b);cx.lineTo(a+side*spread,b-3-rand()*9);cx.moveTo(a,b);cx.lineTo(a+side*spread*.72,b+rand()*9);cx.stroke();
    }
    if(branch%3===0){
     cx.strokeStyle=branch%2?'rgba(255,252,235,.76)':'rgba(200,220,204,.60)';cx.lineWidth=1.6+rand()*2;
     cx.beginPath();cx.moveTo(tipX*.32,stemY*.49+tipY*.51-3);cx.quadraticCurveTo(tipX*.73,tipY+4,tipX,tipY-2);cx.stroke();
    }
   }
   for(let bulb=0;bulb<12;bulb++){
    const a=(rand()-.5)*radius*1.65,b=y-18+rand()*23;
    const glow=cx.createRadialGradient(a,b,0,a,b,9);glow.addColorStop(0,'#fff4c4');glow.addColorStop(.24,'#ffd978b0');glow.addColorStop(1,'#ffca4500');
    ellipse(a,b,9,9,glow);ellipse(a,b,1.3,1.6,'#fff8ce');
    if(bulb%5===0)ellipse(a+4,b-4,3.4,3.6,bulb%2?'#cb3443':'#ffcd69');
   }
  }
  cx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:16;const px=Math.cos(a)*r,py=-380+Math.sin(a)*r;i?cx.lineTo(px,py):cx.moveTo(px,py)}
  cx.closePath();cx.shadowBlur=16;cx.shadowColor='#face6a';cx.fillStyle='#ffe098';cx.fill();cx.restore();
 }

 const form = document.querySelector('#friendForm');
 const field = document.querySelector('#friendName');
 const button = form.querySelector('button');
 const status = document.querySelector('#gestureStatus');
 form.addEventListener('submit', event => {
  event.preventDefault();
  const name = field.value.trim();
  if (!name) {
   status.textContent = '请输入名字。';
   field.focus();
   return;
  }
  if (button.disabled) return;
  const greeting = 'Dear ' + name + ', Merry Christmas!';
  field.blur();
  document.querySelector('#postcardGreeting').textContent = greeting;
  document.querySelector('#postcardSender').hidden = false;
  button.disabled = true;
  button.textContent = '正在打开…';
  status.textContent = '正在准备 3D 圣诞树，音乐可以继续播放。';
  document.querySelector('#friendGreeting').textContent = greeting;

  const script = document.createElement('script');
  script.type = 'module';
  script.src = './tree-scene-gesture.js';
  const slowTimer = setTimeout(() => {
   status.textContent = '祝福已送达。3D 还在加载，可以先看贺卡。';
  }, 8000);

  function cleanup() {
   clearTimeout(slowTimer);
   window.removeEventListener('tree-3d-ready', ready);
   window.removeEventListener('tree-3d-failed', failed);
   script.removeEventListener('error', failed);
  }
  function failed(event) {
   cleanup();
   script.remove();
   button.disabled = false;
   button.textContent = '重试打开';
   status.textContent = event.type === 'error'
    ? '祝福已送达。3D 文件加载失败，可以重试。'
    : '祝福已送达。此浏览器暂时无法启动 3D，可以重试。';
  }
  function ready() {
   cleanup();
   document.body.classList.remove('postcard-mode');
   document.querySelector('#postcard').hidden = true;
   document.querySelector('#morven3d').hidden = false;
  }
  window.addEventListener('tree-3d-ready', ready);
  window.addEventListener('tree-3d-failed', failed);
  script.addEventListener('error', failed);
  // Give the button and status a frame to update before starting the 3D engine.
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.append(script)));
 });
 requestAnimationFrame(draw);
 if (window.ResizeObserver) new ResizeObserver(draw).observe(canvas);
 else window.addEventListener('resize', draw);
})();
</script>

<button id="musicToggle" type="button" aria-label="播放音乐" aria-pressed="false"><span aria-hidden="true">♫</span></button>
<script>
(() => {
 const song = document.querySelector('#holidayMusic');
 const toggle = document.querySelector('#musicToggle');
 const startTime = 38;
 const volume = 0.32;
 const fadeSeconds = 3;
 let context, gain, hasPlayed = false, manuallyPaused = false;

 song.currentTime = startTime;
 song.volume = volume;

 function prepareAudio() {
  if (context) return;
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  if (!AudioEngine) return;
  context = new AudioEngine();
  gain = context.createGain();
  gain.gain.value = 0;
  context.createMediaElementSource(song).connect(gain).connect(context.destination);
  song.volume = 1;
 }

 function playMusic() {
  try {
   prepareAudio();
   if (context?.state === 'suspended') void context.resume().catch(() => {});
  } catch (error) {
   console.warn('Music fade unavailable', error);
  }
  void song.play().catch(() => {});
 }

 function setPlaying(playing) {
  toggle.setAttribute('aria-pressed', String(playing));
  toggle.setAttribute('aria-label', playing ? '暂停音乐' : '播放音乐');
 }

 song.addEventListener('playing', () => {
  if (song.seeking) return;
  if (gain && !hasPlayed) {
   const now = context.currentTime;
   gain.gain.setValueAtTime(0, now);
   gain.gain.linearRampToValueAtTime(volume, now + fadeSeconds);
  }
  hasPlayed = true;
  setPlaying(true);
 });
 song.addEventListener('pause', () => setPlaying(false));
 song.addEventListener('waiting', () => setPlaying(false));
 song.addEventListener('error', () => setPlaying(false));

 toggle.addEventListener('click', () => {
  manuallyPaused = !song.paused;
  if (manuallyPaused) song.pause();
  else playMusic();
 });

 function playOnFirstInteraction(event) {
  if (!event.isTrusted || toggle.contains(event.target)) return;
  if (event.type === 'keydown' && (event.key === 'Tab' || event.isComposing)) return;
  if (!hasPlayed && !manuallyPaused) playMusic();
 }
 document.addEventListener('pointerup', playOnFirstInteraction, true);
 document.addEventListener('click', playOnFirstInteraction, true);
 document.addEventListener('keydown', playOnFirstInteraction, true);
 playMusic();
})();
</script>
